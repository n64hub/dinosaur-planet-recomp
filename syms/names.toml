# Names worked out from the game's code. Each says where its evidence is (a file of src/game, docs/story-points.md, a
# function), and a name found wrong is changed here.
#
# - [[func]]: section ("main" or "dll<n>"), vram (as in syms/), name. tools/gen_syms.py writes it into syms/, so the
#   recompiled code and us.toml's hooks use it: rerun gen_syms.py and change whatever used the old name.
# - [[addr]]: vram, name, and returns ("obj <dll> <label>") for a function that returns an object. A main-segment
#   function or data address as tools/dino.py prints it; its symbol in syms/ keeps its func_<address> name.
# - [[export]]: dll, index, name: a DLL's export, as `dll<n>.<index> <name>`.
# - [[bit]]: bit, name: one of the story's bits (docs/story-points.md, The bits). One without a name prints its task.
# - [[field]]: of ("obj", "state" or "setup"), offset, name, and dll for a state or setup only that DLL's has: the
#   field at that offset of an object, its state (obj+0xB8) or its placement (ROM file 31).

