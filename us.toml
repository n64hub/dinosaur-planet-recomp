# (src/game/swapstone_hollow.cpp), SHseqobject's update (dll309_0124), for an object whose setup waits on bit 0xC3 (its
# setup, +0x4C of $a0, holds the bit at +0x1A), asks dino_tricky_run whether the player has come.
[[patches.hook]]
func = "dll309_0124"
before_vram = 0x9017AC40
text = '{ int dino_tricky_run_restored(void); if ((int16_t)MEM_H(0x1A, MEM_W(0x4C, ctx->r4)) == 0xC3 && dino_tricky_run_restored()) { void dino_tricky_run(uint8_t*, recomp_context*); recomp_context c = *ctx; dino_tricky_run(rdram, &c); } }'

# The SwapStone (SHswapstone, dll515) answers only while bit 0x887 says the player is in its zone, and TriggerPlane
# 40b79 (map 7, local 2388,-633,1592) keeps that bit with action 0x12 mode 2, arg 0x8887: it flips it on each crossing.
# A flip stays right only while every way in and out crosses the plane, and the SwapStone's own warp and the Swap
# Store's send-out both put the player at warp 15, inside the zone, with the bit as it was: once it is the wrong way
# round, every crossing keeps it so, and the SwapStone answers only outside its zone. dll325_09B4 runs a plane's
# actions with the crossing's direction in $s3, +1 front to back, and played across the plane +1 is the way in (east,
# toward the SwapStone). So for that arg, before the call to the bit action (dll325_1764, the arg in $t3), the bit is
# set to whether the crossing goes in, and the call is skipped.
[[patches.hook]]
func = "dll325_09B4"
before_vram = 0x90185540
text = '{ if ((ctx->r11 & 0xFFFF) == 0x8887) { recomp_context c = *ctx; c.r4 = 0x887; c.r5 = (int32_t)ctx->r19 > 0; func_80014670(rdram, &c); goto L_90185A34; } }'

# Cape Claw's SandEels (dll216, setups 0x41BFA/B/C beside the worm) each hold a bit at +0x18 of their setup, 0x1EB,
# 0x1EC and 0x22A, which an eel sets once it is beaten (its state at dll216_34A0) and the worm's constructor rotates
# each time the map loads (it clears 0x1EB and sets 0x1EC or 0x22A). The baddies' shared init (dll33_2000, kept at
# 0x39C of the eel's state) makes the eel hidden (obj +0xDC) while that bit is set. dll216_02C0 restarts a hidden eel
# whose uid isn't on dll29's respawn list (dll29_109C, $v0 1), through that same init: its burst, sound 0xB20 and
# alpha 0xFF. With its bit set the init only hides it again, so it restarts every frame, about 90 sounds a second
# across three eels, until all 32 sound states are held. The game reaches that in play, wherever the worm has the
# eels' group 11 on with one of its eels beaten: a hidden eel with its bit set stays hidden, at 0x9011CDC0.
[[patches.hook]]
func = "dll216_02C0"
before_vram = 0x9011CBBC
text = "{ int32_t bit = (int16_t)MEM_H(0x39C, ctx->r17); if (ctx->r2 != 0 && bit != -1) { gpr v0 = ctx->r2; ctx->r4 = bit; func_800147EC(rdram, ctx); if (ctx->r2 != 0) goto L_9011CDC0; ctx->r2 = v0; } }"

# A scene that moves the player: dll3 holds the player (+0xB0 bit 0x1000) and its update stops. Its collision (dll27.5)
# keeps where it last stood, and the update's first pass after the scene sweeps from there, before the player's own
# release (dll210_60A8, by dll210_7260) resets it a pass later, so whatever stands between the two stops the player
# there: BOSS TRex's intro walks Sabre in from the warp, the door (KT_RexDoorPlaye, z -9810) shuts behind her at the
# scene's start, and as the scene ended the sweep put her back on the far side of it, 38 units short of the door, shut
# out of the arena for good. Here dll210_7260 runs at that pass, before dll27.3 to dll27.5 (the player in $s2, the state
# in $s1), so the collision starts where the scene left the player.
[[patches.hook]]
func = "dll210_0934"
before_vram = 0x900E8EE0
text = "{ if (MEM_HU(0xB0, ctx->r18) & 0x1000) { recomp_context c = *ctx; c.r4 = ctx->r18; c.r5 = ctx->r17; dll210_7260(rdram, &c); } }"

