# --warp (src/main/main.cpp, development): func_800145AC runs once a pass of the main thread's loop, and at its start
# asks whether a warp is due; if one is, it calls the game's warp, func_8004D1D4 (the entry's index, then 0 for no
# fade), as the game's own warps do, and goes on with the registers it had. --story (src/game/story.cpp) starts its
# point from the same place, before any warp.
[[patches.hook]]
func = "func_800145AC"
before_vram = 0x800145AC
text = '{ void dino_story_pass(uint8_t*, recomp_context*); int dino_warp_due(void); recomp_context saved = *ctx; dino_story_pass(rdram, ctx); *ctx = saved; int w = dino_warp_due(); if (w >= 0) { ctx->r4 = w; ctx->r5 = 0; func_8004D1D4(rdram, ctx); *ctx = saved; } }'
