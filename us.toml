# N64Recomp's configuration for Dinosaur Planet's December 2000 prototype, MD5 49f7bb346ade39d1915c22e090ffd748: it reads
# the game's code by the symbols in syms/ (tools/gen_syms.py, from the ROM alone) and writes RecompiledFuncs/
# (tools/recompile.sh). The code is stored raw in the ROM, so there is nothing to decompress first.
[input]
# The ROM header's entrypoint, the start of the main segment.
entrypoint = 0x80000400
# Paths are relative to this file.
symbols_file_path = "syms/dinoplanet.syms.toml"
rom_file_path = "roms/dinoplanet.z64"
output_func_path = "RecompiledFuncs"
use_absolute_symbols = true

[patches]
# func_80014598, the first thing the game's main thread calls, writes 0x4040 to 0xBC000C02, a register of the
# development hardware the prototype ran on: a console has nothing there, and neither does the runtime.
stubs = ["func_80014598"]

# The DLLs (tools/gen_syms.py's header says what one is). func_8000C3CC loads one: it allocates its memory, reads it
# from ROM file 70 (offset 0x30($sp), size 0x2C($sp)) into it ($s0), clears its bss, relocates it and flushes the
# caches. Once it has, the runtime maps the DLL's section there (src/game/dlls.cpp), so that the game's calls through
# its exports, its GOT and the pointers it hands out reach its functions, and its $gp is its GOT's address.
[[patches.hook]]
func = "func_8000C3CC"
before_vram = 0x8000C484
text = "{ void dino_dll_loaded(uint8_t*, recomp_context*); dino_dll_loaded(rdram, ctx); }"

# func_8000C258 unloads one when nothing holds it any more (its count in the table at 0x800A7D10 reaches 0): it calls its
# destructor, fills its text with break instructions and
# frees its memory ($a0 at the free): the runtime takes its section back out first, so that memory reused for another
# DLL or anything else is not called as this one.
[[patches.hook]]
func = "func_8000C258"
before_vram = 0x8000C340
text = "{ void dino_dll_unloading(uint8_t*, recomp_context*); dino_dll_unloading(rdram, ctx); }"

# func_8001B4F0 (tools/gen_syms.py, ONE_FUNCTION) jumps through a table of words at 0x80090444, indexed by a byte of the
# model's that it has checked is not 0. The table's only entry but the first is at index 1, 0x8001C8B8, and the rest
# are 0, which no console could jump to: so the jump goes there, as N64Recomp can follow. (jr $s1 -> j 0x8001C8B8)
[[patches.instruction]]
func = "func_8001B4F0"
vram = 0x8001C8B0
value = 0x0800722E

# func_80001220 checks the cartridge at boot: it waits for the PI to be idle (PI_STATUS, 0xA4600010) and reads the word
# at ROM offset 0x578 straight from the cartridge's address (0xB0000578), and sets the byte at 0x8008C520 when its low
# half isn't 0x8965. The runtime maps neither, so the wait reads idle (lw $v0, 0($v1) -> or $v0, $zero, $zero) and the
# word comes from the ROM the runtime holds (lw $t1, 0x578($t9) -> nop, then the hook; src/game/cartridge.cpp).
[[patches.instruction]]
func = "func_80001220"
vram = 0x800012D8
value = 0x00001025

[[patches.instruction]]
func = "func_80001220"
vram = 0x80001300
value = 0x00000000

[[patches.hook]]
func = "func_80001220"
before_vram = 0x80001304
text = "{ uint32_t dino_rom_word(uint32_t); ctx->r9 = (int32_t)dino_rom_word(0x578); }"

# The development hardware's signature, "LSFS" or "MPFS" in the halfwords at 0xBC000000 and 0xBC000002, which the
# game reads in three places: func_800145AC, each pass of the main thread's loop, zeroes memory from 0x80000000 to
# 0x80400000 without it, and dll3 and dll210 each call a function of theirs with 0x100000. The runtime maps nothing
# there, so each pair of reads gives "LSFS", as on that hardware (lh -> addiu of 0x4C53 and 0x4653).
[[patches.instruction]]
func = "func_800145AC"
vram = 0x800145B0
value = 0x24024C53

[[patches.instruction]]
func = "func_800145AC"
vram = 0x800145B8
value = 0x24194653

[[patches.instruction]]
func = "dll3_60AC"
vram = 0x90011074
value = 0x24024C53

[[patches.instruction]]
func = "dll3_60AC"
vram = 0x9001107C
value = 0x24084653

[[patches.instruction]]
func = "dll210_A3FC"
vram = 0x900F2474
value = 0x24024C53

[[patches.instruction]]
func = "dll210_A3FC"
vram = 0x900F247C
value = 0x240D4653

# func_80011C70, which makes each audio frame, reads the AI's remaining length straight from AI_LEN (0xA4500004),
# where libultra has osAiGetLength: the runtime's gives it (lw $t9, 4($t8) -> nop, then the hook).
[[patches.instruction]]
func = "func_80011C70"
vram = 0x80011CC0
value = 0x00000000

[[patches.hook]]
func = "func_80011C70"
before_vram = 0x80011CC4
text = "{ void osAiGetLength_recomp(uint8_t*, recomp_context*); uint64_t v0 = ctx->r2; osAiGetLength_recomp(rdram, ctx); ctx->r25 = ctx->r2; ctx->r2 = v0; }"

# The audio frame's command list kept inside its 0x4000 bytes (src/game/audio.cpp): func_800642F4 starts a frame in
# the list at $a0, and func_80075F20 pulls each source with func_8006C840 ($a2 the list's end, returning the new one in
# $v0), which leaves the source out once the rest of the frame would run past the list. Past it is DLL 1.
[[patches.hook]]
func = "func_800642F4"
before_vram = 0x80064314
text = "{ void dino_audio_frame(uint32_t); dino_audio_frame((uint32_t)ctx->r4); }"

[[patches.hook]]
func = "func_8006C840"
before_vram = 0x8006C840
text = "{ int dino_audio_pull_skipped(uint32_t); if (dino_audio_pull_skipped((uint32_t)ctx->r6)) { ctx->r2 = ctx->r6; return; } }"

[[patches.hook]]
func = "func_80075F20"
before_vram = 0x80076030
text = "{ void dino_audio_pulled(uint32_t); dino_audio_pulled((uint32_t)ctx->r2); }"

[[patches.hook]]
func = "func_80075F20"
before_vram = 0x800763A0
text = "{ void dino_audio_pulled(uint32_t); dino_audio_pulled((uint32_t)ctx->r2); }"

# The prototype's own crashes, each fixed where the game reads what isn't there. The labels a hook jumps to are
# N64Recomp's for a branch target the function already has (L_<its address>).

# Lunaimar (dll243, object 22, Moon Mountain Pass) once it has seen the player: dll243_0C44 takes the sidekick from
# func_8002394C, the first object of list 1, which is 0 while Kyte isn't out (Krystal before Cape Claw frees it), and
# reads its position at 0x18($s1) with no test. The game's own way past a sidekick it can't use is the branch at
# 0x9014CFAC (the sidekick's interface +0x64 returns 0), to 0x9014CFF8, which clears flag 4 at 0x3B2($s2) and takes the
# player as the target: a missing sidekick goes there too.
[[patches.hook]]
func = "dll243_0C44"
before_vram = 0x9014CF34
text = "{ if (ctx->r17 == 0) goto L_9014CFF8; }"

# The Cape Claw sand worm (CCsandwormBoss, dll461) the same: dll461_0330 keeps the sidekick at 0x8 of its state
# (0x8($s0) in dll461_05E0), 0 until one is out, and two of its states use it with no test. State 4, the player out
# of reach, asks the sidekick's interface +0x64 at 0x901E56B4, the sidekick in $a0; a sidekick it can't use ends the
# pass at 0x901E5F5C.
[[patches.hook]]
func = "dll461_05E0"
before_vram = 0x901E56B4
text = "{ if (ctx->r4 == 0) goto L_901E5F5C; }"

# State 9, which follows each of the worm's attacks, first turns it to face the sidekick (dll461_12B0 reads 0xC of
# it): with none it faces the player, at 0x4 of the state. With the player out of reach it then measures from the
# sidekick, from 0x901E59B4, and with none goes on as for a sidekick out of reach, at 0x901E5A98: back to state 4 by
# its hole, or state 10.
[[patches.hook]]
func = "dll461_05E0"
before_vram = 0x901E5900
text = "{ if (ctx->r5 == 0) ctx->r5 = MEM_W(0x4, ctx->r16); }"

[[patches.hook]]
func = "dll461_05E0"
before_vram = 0x901E59B4
text = "{ if (MEM_W(0x8, ctx->r16) == 0) goto L_901E5A98; }"

# SHtricky (dll501), beside the Queen Earthwalker in SwapStone Hollow, plays Tricky's run to her on the sidekick: in state
# 0 it waits for bit 0xC3 and starts its sequence 3 on func_8002394C's object ($a3), and in state 2 it calls that
# object's interface +0x5C, both with no test. With no sidekick out, state 0 waits on and state 2 goes to state 3 as it
# would after the call.
[[patches.hook]]
func = "dll501_00A8"
before_vram = 0x901FEE4C
text = "{ if (ctx->r7 == 0) goto L_901FEEB0; }"

[[patches.hook]]
func = "dll501_00A8"
before_vram = 0x901FEE88
text = "{ if (ctx->r7 == 0) { MEM_B(0, ctx->r16) = 3; goto L_901FEEB0; } }"

# The other DLLs that use func_8002394C's sidekick with no test reach that use only while one is out, so they have no
# hook. The perches' query 1 (PerchObject dll718_03A0, RestPerch dll726_0410) is asked by Kyte (dll212) about herself.
# CCvines (dll719) reads it in the state Kyte's own call to its export 7 starts. SC_lightfoot (dll516_1B8C) commands it
# in a countdown its setup's bit at +0x1C starts, and SwapStone Circle's two have no bit (-1). NWtricky's (dll497)
# cutscene callback runs only in the sequences its update starts on the sidekick, an update that does nothing with
# none. Played with no sidekick beside them in CloudRunner Fortress, Northern Wastes and SwapStone Circle, none of those
# uses ran.

# A carried object freed: a SmallBasket or SmallCrate (dll295) carried out of its group is freed in the player's hands,
# and the player's draw calls into it the next frame (src/game/objects.cpp). The object free lets the player go of it.
[[patches.hook]]
func = "func_80022F94"
before_vram = 0x80022F94
text = "{ void dino_object_freed(uint8_t*, uint32_t); dino_object_freed(rdram, (uint32_t)ctx->r4); }"

# The Swap Store's item beams (SPitembeam, dll772) the same: a beam's constructor keeps the nearest object of list 0xA,
# the item under it, at +0xDC, and its update asks that item's interface +0x28 at 0x902C5888 with no test. With no item
# it goes on as for an item that is gone, at 0x902C58D8, which hides the beam.
[[patches.hook]]
func = "dll772_0088"
before_vram = 0x902C5888
text = "{ if (ctx->r4 == 0) goto L_902C58D8; }"

# The Swap Store's send-out and the Magic Plant need no hook. Being sent out (dll769_0A1C) warps to entry 15 for a
# player whose +0x46 is 0 and 14 otherwise, and played with the shopkeeper there (group 0 of bit 0x601) it walks the
# player out to SwapStone Circle. MagicPlant (dll290_05F8) keeps its MagicDust (dll291) at +0 of its state and the dust
# keeps the plant at +0xC4, which the dust only tests for 0 (dll291_03F0) before it calls DLL 27's export 7 on itself,
# so a dust that outlives its plant reads nothing of it, and a plant hit from the west in SwapStone Hollow plays on. The
# one way in, a dust create that fails (func_800213EC hands func_80021A84 what it made with no test, and dll290_05F8 writes its
# +0xC4), takes an object heap that is full, which all of SwapStone Hollow's groups at once doesn't make.

# An object that fails to be made: func_800213EC makes one through func_8001275C into 0x2C($sp) and hands it to
# func_80021A84 with no test, which reads its +0x30 at once, and with none there that is a read of address 0x30. It
# came in Golden Plains' shrine from its fly baddie's shot (dll475 0x8C0), which asked for a second player (below).
# func_80021A84 with no object returns at once, and func_800213EC returns the 0 it got, which its callers test.
[[patches.hook]]
func = "func_80021A84"
before_vram = 0x80021A84
text = "{ if (ctx->r4 == 0) return; }"

# A vertex block too small for its pools: func_8004D470 allocates 0x8020 bytes for three pools of vertices (16 bytes
# each), each a pair of halves that the frames take in turn: 0x800B98A0 at +0 and +0xFA0, 0x800B98A8 at +0x1F40 and
# +0x3E80, 0x800B98B0 at +0x5DC0 and +0x76C0. func_8004DBAC fills a half of the third with up to 400 vertices (0x18F
# at 0x8004E298 and 0x8004E36C), so its second half runs to +0x8FC0, 0xFA0 past the block's end and over the heap
# block after it. Dragon Rock - Bottom's Skeetla fight, whose objects grow in number as Skeetlas come, passes 150 there
# after a minute or so and wrote vertices over models, crashing somewhere new each time. The block is the 0x8FC0 its
# pools fill (ori $a0, $zero, 0x8020 -> 0x8FC0).
[[patches.instruction]]
func = "func_8004D470"
vram = 0x8004D484
value = 0x34048FC0

# RT64's interpolation to the display's rate: each hook writes RT64's commands into the list where the game is about to
# write its own (src/game/interpolation.cpp's header says what and why). func_8004225C draws the frame, and takes the
# list's pointer's address in $a0. func_800026C8 loads a camera, with the list's at 0x800028AC ($a1 its address, $s0 the
# camera) the first thing it writes. func_80035000 draws an object, with a model from 0x8003507C and done with it at
# 0x80035774, which both of the ways through it reach with the list's pointer in $t2.
[[patches.hook]]
func = "func_8004225C"
before_vram = 0x8004225C
text = '{ void dino_interp_frame(uint8_t*, recomp_context*); dino_interp_frame(rdram, ctx); }'

[[patches.hook]]
func = "func_800026C8"
before_vram = 0x800028AC
text = '{ void dino_interp_camera(uint8_t*, recomp_context*); dino_interp_camera(rdram, ctx); }'

[[patches.hook]]
func = "func_80035000"
before_vram = 0x8003507C
text = '{ void dino_interp_object_begin(uint8_t*, recomp_context*); dino_interp_object_begin(rdram, ctx); }'

[[patches.hook]]
func = "func_80035000"
before_vram = 0x80035774
text = '{ void dino_interp_object_end(uint8_t*, recomp_context*); dino_interp_object_end(rdram, ctx); }'

# The game's hand-written math (its matrix, vector and spline routines, the conversion of a float matrix into the
# fixed-point one the RSP reads, and the skinning of its models) uses the odd float registers as registers of their
# own, as the CPU does with Status.FR set: libultra's C code is built for FR clear, where an odd register is the high
# half of the even one before it, and N64Recomp's moves to and from an odd register follow the mode the runtime is in
# while its arithmetic always reads the separate one. In the runtime's default mode (FR clear) a constant moved into
# $f13 and multiplied by it reads 0, so every matrix these make is 0 and nothing in the world is drawn. Each of them
# runs in FR set from its first instruction and goes back to FR clear before each of its returns. None of them calls
# another or uses a double, and their float arguments come in even registers. func_8001B4F0's subroutines return
# within it ($ra inside it), so only a return to its caller goes back.

[[patches.hook]]
func = "func_80014FEC"
before_vram = 0x80014FEC
text = '{ ctx->f_odd = &ctx->f1.u32l; ctx->mips3_float_mode = 1; }'

[[patches.hook]]
func = "func_80014FEC"
before_vram = 0x800150DC
text = '{ ctx->f_odd = &ctx->f0.u32h; ctx->mips3_float_mode = 0; }'

[[patches.hook]]
func = "func_800150E4"
before_vram = 0x800150E4
text = '{ ctx->f_odd = &ctx->f1.u32l; ctx->mips3_float_mode = 1; }'

[[patches.hook]]
func = "func_800150E4"
before_vram = 0x800151FC
text = '{ ctx->f_odd = &ctx->f0.u32h; ctx->mips3_float_mode = 0; }'

